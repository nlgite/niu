<!DOCTYPE html>
<html>
<head>
  <title>Niu family</title>
  <link rel="icon" type="image/png" href="celegan.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column; 
      justify-content: flex-start;
      align-items: center;

      background: #f4f4f4;
      font-family: Arial, sans-serif;
      padding-top: 80px; 
    }

    /* Top navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      background: #222;
      padding: 10px 0;

      display: flex;
      justify-content: center;
      gap: 20px;

      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    nav button {
      background: none;
      border: none;
      cursor: pointer;
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 8px 16px;
      border-radius: 6px;
      transition: 0.3s;
    }

    nav button:hover, nav button.active {
      background: #007bff;
    }

    /* Content Sections Styling */
    .content-section {
      display: none; 
      width: 90%;
      max-width: 900px; /* Widened slightly to accommodate the grid comfortably */
      margin: 20px 0;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .content-section.active {
      display: block; 
    }

    /* Grid container */
    .button-group {
      display: grid;
      /* 5 columns */
      grid-template-columns: repeat(5, 150px);
      gap: 20px;
      margin-top: 30px;
      justify-content: center; /* Centers the grid columns inside the Home section */
    }

    /* Button style */
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;

      background: transparent;
      border: 1px solid black;

      height: 40px;

      color: black;
      text-decoration: none;

      border-radius: 10px;

      font-size: 18px;

      transition: 0.3s;
    }

    .btn:hover {
      background: #0056b3;
      color: white;
    }
  </style>
</head>

<body>

  <nav>
    <button onclick="showSection('home')" id="btn-home" class="active">Home</button>
    <button onclick="showSection('work')">Work</button>
    <button onclick="showSection('family')">Family</button>
    <button onclick="showSection('finance')">Finance</button>
    <button onclick="showSection('tailscale')">TailScale</button>
  </nav>

  <div id="home" class="content-section active">
    <div class="button-group">
      <a href="https://www.alliancegenome.org/" target="_blank" class="btn">Alliance</a>
      <a href="https://wormbase.org/#012-34-5" target="_blank" class="btn">Wormbase</a>
      <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" class="btn">Pubmed</a>
      <a href="https://www.uniprot.org/" target="_blank" class="btn">UniProt</a>

    </div>
  </div>
  <div id="weblink" class="content-section">
     <div class="button-group">
      <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" class="btn">PubMed</a>  
      <a href="https://www.connectedpapers.com/" target="_blank" class="btn">ConnectedPapers</a>  
       <a href="https://www.era.nih.gov/register-accounts/access-era-modules-via-login-gov.htm" target="_blank" class="btn">NIH eRA</a>  
       <a href="https://www.connectedpapers.com/" target="_blank" class="btn">ConnectedPapers</a>  
       <a href="https://github.com/nlgite/niu" target="_blank" class="btn">Github</a>
     </div>

  </div>

  <div id="family" class="content-section">

      <div class="button-group">
        <a href="https://mychart.uconn.edu/MyChart/Authentication/Login?" target="_blank" class="btn">My Chart</a>
      </div>
  </div>


    <div id="tailscale" class="content-section">
    <div class="button-group">
      <a href="http://100.108.89.26/wormui.html" target="_blank" class="btn">WormStrains</a>
      <a href="http://100.108.89.26/paperweb.html" target="_blank" class="btn" style="color: #9400D3">PaperWeb</a>
      <a href="http://100.108.89.26:8081/" target="_blank" class="btn" style="color: #9400D3">Trilium Note</a>
      <a href="http://100.108.89.26:5230/" target="_blank" class="btn" style="color: #9400D3">Memos</a>
    </div>
  </div>

  <script>
    function showSection(sectionId) {
      const sections = document.querySelectorAll('.content-section');
      sections.forEach(section => {
        section.classList.remove('active');
      });

      const navButtons = document.querySelectorAll('nav button');
      navButtons.forEach(button => {
        button.classList.remove('active');
      });

      document.getElementById(sectionId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
